services:
  # Python FastAPI Backend Service on Render
  - type: web
    name: imd-early-warning-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8

  # Static Web Service on Render (Optional alternative to Netlify/Vercel)
  - type: static
    name: imd-early-warning-frontend
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
